name: Autonomous Newspaper Loop

on:
  schedule:
    - cron: '0 6 * * *' # Запуск каждый день в 06:00 UTC
  workflow_dispatch:       # Кнопка ручного запуска для тестов

permissions:
  contents: write

jobs:
  publish-edition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: pip install google-genai pydantic pillow
        
      - name: Run Editorial Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python editor_agent.py
        
      - name: Commit and Push New Edition
        run: |
          git config --local user.email "editor@autonomous.newspaper"
          git config --local user.name "Autonomous Editor Agent"
          git add .
          git commit -m "Auto-publish new newspaper edition" || exit 0
          git push
